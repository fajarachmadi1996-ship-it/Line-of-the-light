<style>
  :root{
    --ink:#3F1523;
    --ink-soft:#5A6070;
    --surface:#F5F1E6;
    --surface-raised:#FFFDF9;
    --line:#DFD9C8;
    --gold:#B8896A;
    --gold-soft:#EFE3C4;
    --urgent:#8A8375;
    --urgent-bg:#EDEAE1;
    --week:#B8896A;
    --week-bg:#F4E6DC;
    --soon:#2E6B52;
    --soon-bg:#DEEEE5;
    --monitor:#8A8375;
    --monitor-bg:#EDEAE1;
    --club:#8C7A5B;
    --elite:#6B5842;
    --sapphire:#2E4C7A;
    --ruby:#8B2635;
    --emerald:#1F5C46;
    --diamond:#5B6470;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--surface);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{background:var(--gold-soft);}
  button{font-family:inherit;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:30;
    background:var(--ink);
    color:var(--surface);
    padding:14px 16px 12px;
  }
  .topbar-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .brand{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:15px;
    letter-spacing:0.01em;
    color:var(--surface);
    opacity:0.85;
  }
  .brand b{color:var(--gold);font-weight:600;}
  .gear-btn{
    background:none;border:1px solid rgba(246,241,231,0.28);
    color:var(--surface); border-radius:8px; width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer; flex-shrink:0;
  }
  .gear-btn svg{width:16px;height:16px;}
  .hero{
    display:flex; align-items:baseline; gap:10px; margin-top:10px;
  }
  .hero-num{
    font-family:'Fraunces',serif; font-weight:600;
    font-size:40px; line-height:1; color:var(--surface);
  }
  .hero-label{
    font-size:13px; color:rgba(246,241,231,0.7); line-height:1.35; max-width:220px;
  }
  .stat-strip{
    display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;
  }
  .stat-chip{
    flex:0 0 auto; padding:6px 11px; border-radius:20px; font-size:12.5px; font-weight:500;
    display:flex; align-items:center; gap:6px; cursor:pointer; border:1px solid transparent;
    white-space:nowrap; background:rgba(246,241,231,0.08); color:rgba(246,241,231,0.85);
  }
  .stat-chip.active{background:var(--surface); color:var(--ink);}
  .stat-chip .dot{width:7px;height:7px;border-radius:50%;}

  /* ---------- Controls ---------- */
  .controls{
    position:sticky; top:112px; z-index:25;
    background:var(--surface);
    padding:10px 16px 8px;
    border-bottom:1px solid var(--line);
  }
  .search-row{display:flex; gap:8px;}
  .search-box{
    flex:1; position:relative;
  }
  .search-box input{
    width:100%; padding:9px 12px 9px 34px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-raised); font-size:14px; color:var(--ink);
  }
  .search-box input:focus{outline:2px solid var(--gold); outline-offset:1px;}
  .search-box svg{position:absolute; left:11px; top:50%; transform:translateY(-50%); width:14px;height:14px; opacity:0.45;}
  .staff-select{
    padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-raised); font-size:13px; color:var(--ink); max-width:132px;
  }
  .sub-row{display:flex; gap:14px; margin-top:8px; align-items:center;}
  .count-note{font-size:12px; color:var(--ink-soft);}
  .sort-toggle{
    margin-left:auto; font-size:12px; color:var(--ink-soft); background:none; border:none;
    cursor:pointer; display:flex; align-items:center; gap:4px; padding:0;
  }

  /* ---------- List ---------- */
  .list{padding:6px 16px 90px;}
  .group-label{
    font-size:12px; font-weight:600; color:var(--ink-soft);
    margin:16px 2px 6px; letter-spacing:0.02em;
  }
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state svg{width:38px;height:38px;opacity:0.35;margin-bottom:10px;}
  .empty-state p{font-size:14px; margin:2px 0;}

  .card{
    background:var(--surface-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--club);
    border-radius:var(--radius);
    margin-bottom:8px;
    overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px; cursor:pointer;
  }
  .card-head .name-block{flex:1; min-width:0;}
  .card-name{font-size:14.5px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .card-meta{font-size:12px; color:var(--ink-soft); margin-top:2px; display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .tier-pill{
    font-size:10.5px; font-weight:600; padding:2px 7px; border-radius:20px; color:#fff;
  }
  .days-badge{
    flex-shrink:0; text-align:center; max-width:92px;
    padding:5px 8px; border-radius:8px; font-size:10.5px; font-weight:600; line-height:1.25;
  }
  .days-badge .n{font-size:16px; font-family:'Fraunces',serif; display:block; line-height:1.1;}
  .stage-dots{display:flex; gap:4px; flex-shrink:0;}
  .stage-dots .d{width:7px;height:7px;border-radius:50%; background:var(--line); border:1px solid var(--line);}
  .stage-dots .d.done{background:var(--soon); border-color:var(--soon);}
  .stage-dots .d.due{background:var(--urgent); border-color:var(--urgent);}
  .chev{width:14px;height:14px; opacity:0.4; flex-shrink:0; transition:transform .15s ease;}
  .card.open .chev{transform:rotate(180deg);}

  .card-body{
    display:none; padding:0 12px 12px; border-top:1px solid var(--line);
  }
  .card.open .card-body{display:block;}
  .cust-sub{font-size:11.5px; color:var(--ink-soft); padding:9px 0 4px; display:flex; flex-wrap:wrap; gap:x 10px; gap:10px;}

  .stage-row{
    display:flex; align-items:center; gap:9px; padding:8px 0; border-top:1px dashed var(--line);
  }
  .stage-row:first-of-type{border-top:none;}
  .stage-check{
    width:22px;height:22px; border-radius:6px; border:1.5px solid var(--line);
    flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer;
    background:var(--surface-raised);
  }
  .stage-check.checked{background:var(--soon); border-color:var(--soon);}
  .stage-check svg{width:13px;height:13px; color:#fff; display:none;}
  .stage-check.checked svg{display:block;}
  .stage-info{flex:1; min-width:0;}
  .stage-title{font-size:13px; font-weight:600; color:var(--ink);}
  .stage-date{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .stage-date.overdue{color:var(--urgent);}
  .wa-btn{
    flex-shrink:0; width:34px;height:34px; border-radius:8px; border:none;
    background:#25D366; display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .wa-btn svg{width:18px;height:18px;fill:#fff;}
  .wa-btn:disabled{background:var(--line); cursor:not-allowed;}

  .preview-toggle{
    font-size:11.5px; color:var(--gold); background:none; border:none; padding:8px 0 2px;
    cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }
  .preview-box{
    display:none; background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:9px 10px; font-size:12.5px; line-height:1.5; color:var(--ink-soft); margin-bottom:8px; white-space:pre-wrap;
  }
  .preview-box.show{display:block;}

  /* ---------- Load more ---------- */
  .load-more{
    display:block; width:100%; padding:11px; margin-top:6px; border-radius:9px;
    border:1px solid var(--line); background:var(--surface-raised); color:var(--ink-soft);
    font-size:13px; font-weight:500; cursor:pointer;
  }

  /* ---------- Settings modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(26,24,22,0.5); z-index:50; display:none;
  }
  .modal-backdrop.show{display:block;}
  .modal{
    position:fixed; left:0; right:0; bottom:0; z-index:51;
    background:var(--surface); border-radius:16px 16px 0 0; max-height:88vh; overflow-y:auto;
    transform:translateY(100%); transition:transform .22s ease; padding:0 0 30px;
  }
  .modal.show{transform:translateY(0);}
  .modal-head{
    position:sticky; top:0; background:var(--surface); padding:16px 16px 10px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; z-index:2;
  }
  .modal-title{font-family:'Fraunces',serif; font-size:18px; font-weight:600;}
  .modal-close{background:none;border:none; font-size:22px; color:var(--ink-soft); cursor:pointer; line-height:1; padding:4px;}
  .tier-tabs{display:flex; gap:6px; padding:12px 16px 4px; overflow-x:auto;}
  .tier-tab{
    flex:0 0 auto; padding:6px 12px; border-radius:20px; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); background:var(--surface-raised); color:var(--ink-soft); cursor:pointer;
  }
  .tier-tab.active{color:#fff; border-color:transparent;}
  .tmpl-field{padding:10px 16px;}
  .tmpl-field label{font-size:12.5px; font-weight:600; color:var(--ink); display:block; margin-bottom:5px;}
  .tmpl-field textarea{
    width:100%; min-height:78px; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    font-family:'Inter',sans-serif; font-size:13px; color:var(--ink); resize:vertical; background:var(--surface-raised);
  }
  .tmpl-hint{font-size:11px; color:var(--ink-soft); margin-top:4px;}
  .modal-actions{padding:14px 16px 4px; display:flex; gap:10px;}
  .btn-primary{
    flex:1; padding:11px; border-radius:9px; border:none; background:var(--ink); color:var(--surface);
    font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .btn-ghost{
    padding:11px 14px; border-radius:9px; border:1px solid var(--line); background:none; color:var(--ink-soft);
    font-size:13.5px; cursor:pointer;
  }
  .save-toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(20px); z-index:60;
    background:var(--ink); color:var(--surface); padding:9px 18px; border-radius:20px; font-size:13px;
    opacity:0; transition:all .25s ease; pointer-events:none;
  }
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .loading-screen{
    position:fixed; inset:0; background:var(--surface); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  }
  .loading-screen .spin{
    width:26px;height:26px;border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--gold);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-screen p{font-size:13px; color:var(--ink-soft);}

  .lock-screen{
    position:fixed; inset:0; background:var(--ink); z-index:120;
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center;
  }
  .lock-screen h1{font-family:'Fraunces',serif; font-weight:500; font-size:26px; color:var(--surface); margin:0;}
  .lock-screen p{font-size:13px; color:rgba(246,241,231,0.7); margin:0; max-width:300px; line-height:1.5;}
  .lock-screen input{
    width:100%; max-width:300px; padding:12px 14px; border-radius:10px; border:1px solid rgba(246,241,231,0.3);
    background:rgba(246,241,231,0.08); color:var(--surface); font-size:16px; letter-spacing:0.08em; text-align:center; text-transform:uppercase;
  }
  .lock-screen input:focus{outline:2px solid var(--gold);}
  .lock-screen button{
    width:100%; max-width:300px; padding:12px; border-radius:10px; border:none; background:var(--gold); color:#fff;
    font-size:14px; font-weight:600; cursor:pointer;
  }
  .lock-error{color:#F2B8A8 !important; min-height:18px;}
  .phone-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 0 6px; font-size:12px; color:var(--ink-soft);}
  .phone-row input{
    flex:1; min-width:140px; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:var(--surface-raised); font-size:13px; color:var(--ink);
  }
  .phone-row button{
    padding:8px 12px; border-radius:8px; border:none; background:var(--ink); color:var(--surface);
    font-size:12px; font-weight:600; cursor:pointer;
  }
  .phone-row .link-btn{background:none; color:var(--gold); padding:4px 2px; text-decoration:underline; font-weight:500;}
  .phone-missing{color:var(--urgent); font-weight:600;}
  .item-note{font-size:11.5px; color:var(--ink-soft); padding-top:8px;}

  @media (min-width:640px){
    .list{max-width:600px; margin:0 auto; padding-left:0; padding-right:0;}
    .topbar,.controls{padding-left:calc(50% - 300px); padding-right:calc(50% - 300px);}
    .modal{max-width:600px; left:50%; transform:translate(-50%,100%); border-radius:16px; bottom:20px; max-height:80vh;}
    .modal.show{transform:translate(-50%,0);}
  }
</style>
</head>

</div>

</div>

<div class="controls">

  </div>
</div>

<div class="list" id="list"></div>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="modal" id="settingsModal">
  <div class="modal-head">
    <span class="modal-title">Template Pesan</span>
    <button class="modal-close" id="closeSettings">&times;</button>
  </div>
  <div class="tier-tabs" id="tierTabs"></div>
  <div id="tmplFields"></div>
  <div class="modal-actions">
    <button class="btn-primary" id="saveTemplates">Simpan template</button>
    <button class="btn-ghost" id="resetTemplates">Reset default</button>
  </div>
</div>

<script>
/* ============ Config ============ */
// Link to the invitation image. Works if the GitHub repo is named exactly
// "Line-of-Light" and the image file is uploaded to it (see README.md).
const IMAGE_URL = 'https://fajarachmadi00.github.io/Line-of-Light/line-of-light-invitation.jpg';

const STAGES = [
  { key:'invite',    label:'Kirim Undangan',                 hasWa:true  },
  { key:'rsvpchase', label:'Follow-up RSVP (deadline 15 Okt)', hasWa:true  },

];

const STATUS_META = {
  pending:   { label:'Belum diundang', color:'var(--monitor)', bg:'var(--monitor-bg)' },
  invited:   { label:'Sudah diundang', color:'var(--week)',    bg:'var(--week-bg)'     },
  confirmed: { label:'RSVP confirmed', color:'var(--soon)',    bg:'var(--soon-bg)'     }
};

const DEFAULT_TEMPLATES = {
  invite:
`Dear {{nama}},

*LINE OF LIGHT*

};

/* ============ State ============ */
let RAW = [];
let CUSTOMERS = [];
let templates = null;
let statusData = {};
let phones = {};
let state = {
  tab: 'pending', staff: 'all', search: '', sortNewestFirst: false,
  visible: 40, openCard: null, editPhone: null, settingsStage: 'invite'
};
const PAGE_SIZE = 40;

/* ============ Helpers ============ */
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function normPhone(raw){
  let d = String(raw||'').replace(/\D/g,'');
  if(d.startsWith('0')) d = '62' + d.slice(1);
  else if(d.startsWith('8')) d = '62' + d;
  return (d.length >= 9 && d.length <= 15) ? d : '';
}
function normPass(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,''); }

/* ============ Unlock (data is encrypted in this file) ============ */
async function decryptData(pass){
  if(!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
  const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  const keyMat = await crypto.subtle.importKey('raw', new TextEncoder().encode(normPass(pass)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64(ENC.s), iterations:ENC.n, hash:'SHA-256' },
    keyMat, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(ENC.i) }, key, b64(ENC.c));
  return JSON.parse(new TextDecoder().decode(buf));
}
function showLock(msg){
  document.getElementById('loadingScreen').style.display = 'none';
  document.getElementById('lockScreen').style.display = 'flex';
  document.getElementById('lockError').textContent = msg || '';
}
async function tryUnlock(pass, remember){
  try{
    RAW = await decryptData(pass);
  }catch(e){
    return e && e.message === 'nocrypto' ? 'Browser ini tidak mendukung. Buka lewat Chrome/Safari.' : 'Kode akses salah.';
  }
  if(remember){ try{ localStorage.setItem('lol-pass', normPass(pass)); }catch(e){} }
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('loadingScreen').style.display = 'flex';
  await start();
  return '';
}
async function boot(){
  document.getElementById('unlockBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('unlockBtn');
    btn.disabled = true; btn.textContent = 'Memeriksa…';
    const err = await tryUnlock(document.getElementById('passInput').value, true);
    btn.disabled = false; btn.textContent = 'Buka';
    if(err) document.getElementById('lockError').textContent = err;
  });
  document.getElementById('passInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') document.getElementById('unlockBtn').click();
  });
  let saved = null;
  try{ saved = localStorage.getItem('lol-pass'); }catch(e){}
  if(saved){
    const err = await tryUnlock(saved, false);
    if(!err) return;
    try{ localStorage.removeItem('lol-pass'); }catch(e){}
  }
  showLock('');
}

/* ============ Customers ============ */
function buildCustomers(){
  CUSTOMERS = RAW.map((r, idx)=>({ id:(r.id !== undefined ? r.id : idx), name:r.n, phone:r.p, staff:r.a, items:r.i }));
}
function phoneOf(c){ return phones[c.id] || c.phone || ''; }
function getStatus(c){
  return statusData[c.id] || { invite:false, rsvpchase:false, confirmed:false, reminder:false };
}
function deriveStatus(st){
  if(st.confirmed) return 'confirmed';
  if(st.invite) return 'invited';
  return 'pending';
}
function pendingCount(){ return CUSTOMERS.filter(c => !getStatus(c).invite).length; }

/* ============ Storage ============
   Backends (auto-detected): Claude artifact storage, a Google Apps Script
   URL (works on GitHub Pages), or this device only (localStorage).
*/
const API_URL = 'https://script.google.com/macros/s/AKfycby8LP9Xg7R8DLJUc2bgB3n0xPwG6dy7WXLRglJI_OtfQ6Q0B2tq-pPv3PhkeSQM193P/exec';
const hasClaudeStorage = typeof window.storage !== 'undefined';
const hasSheetBackend = API_URL && API_URL.indexOf('PASTE_YOUR_APPS_SCRIPT_URL_HERE') === -1;
let syncEnabled = hasClaudeStorage || hasSheetBackend;

async function remoteGet(key){
  if(hasClaudeStorage){ const r = await window.storage.get(key, true); return r ? r.value : null; }
  if(hasSheetBackend){
    const res = await fetch(`${API_URL}?key=${encodeURIComponent(key)}`);
    if(!res.ok) throw new Error('network');
    const data = await res.json();
    return data.value || null;
  }
  return localStorage.getItem('lol-local-' + key);
}
async function remoteSet(key, value){
  if(hasClaudeStorage){ return !!(await window.storage.set(key, value, true)); }
  if(hasSheetBackend){
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ key, value })
    });
    return res.ok;
  }
  localStorage.setItem('lol-local-' + key, value);
  return true;
}
// Save one customer's entry without wiping teammates' recent changes:
// re-read the latest copy, apply just this entry, write back.
async function saveEntry(key, store, id){
  try{
    let remote = {};
    try{ const v = await remoteGet(key); remote = v ? JSON.parse(v) : {}; }catch(e){}
    remote[id] = store[id];
    Object.assign(store, remote);
    await remoteSet(key, JSON.stringify(remote));
  }catch(e){ console.error('Gagal menyimpan', key, e); }
}

async function loadAll(){
  try{ const v = await remoteGet('lol-template'); templates = v ? JSON.parse(v) : {}; }catch(e){ templates = {}; }
  Object.keys(DEFAULT_TEMPLATES).forEach(k=>{ if(!templates[k]) templates[k] = DEFAULT_TEMPLATES[k]; });
  try{ const v = await remoteGet('lol-status'); statusData = v ? JSON.parse(v) : {}; }catch(e){ statusData = {}; }
  try{ const v = await remoteGet('lol-phones'); phones = v ? JSON.parse(v) : {}; }catch(e){ phones = {}; }
  try{ const s = localStorage.getItem('lol-my-staff'); if(s) state.staff = s; }catch(e){}
}
async function saveTemplatesToStorage(){
  try{ return await remoteSet('lol-template', JSON.stringify(templates)); }
  catch(e){ console.error(e); return false; }
}

let refreshing = false;
async function refreshRemoteState(){
  if(refreshing || !syncEnabled || !CUSTOMERS.length) return;
  refreshing = true;
  try{ const v = await remoteGet('lol-status'); if(v) statusData = JSON.parse(v); }catch(e){}
  try{ const v = await remoteGet('lol-phones'); if(v) phones = JSON.parse(v); }catch(e){}
  try{ const v = await remoteGet('lol-template'); if(v) templates = Object.assign({}, DEFAULT_TEMPLATES, JSON.parse(v)); }catch(e){}
  const a = document.activeElement;
  const typing = a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') && a.id !== 'searchInput';
  if(!typing) render();
  refreshing = false;
}
function wireResumeRefresh(){
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible') refreshRemoteState(); });
  window.addEventListener('focus', refreshRemoteState);
  window.addEventListener('pageshow', e=>{ if(e.persisted) refreshRemoteState(); });
  setInterval(()=>{ if(document.visibilityState === 'visible') refreshRemoteState(); }, 45000);
}
function renderSyncBanner(){
  const existing = document.getElementById('syncBanner');
  if(syncEnabled){ if(existing) existing.remove(); return; }
  if(existing) return;
  const b = document.createElement('div');
  b.id = 'syncBanner';
  b.style.cssText = 'background:var(--monitor-bg);color:#6B5842;font-size:12px;padding:8px 16px;text-align:center;';
  b.textContent = 'Sinkronisasi antar HP belum aktif — perubahan hanya tersimpan di HP ini.';
  document.body.insertBefore(b, document.body.firstChild.nextSibling);
}

/* ============ Rendering ============ */
function filteredCustomers(){
  let arr = CUSTOMERS;
  if(state.tab === 'nophone') arr = arr.filter(c => !phoneOf(c));
  else if(state.tab !== 'all') arr = arr.filter(c => deriveStatus(getStatus(c)) === state.tab);
  if(state.staff !== 'all') arr = arr.filter(c => c.staff === state.staff);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    arr = arr.filter(c => c.name.toLowerCase().includes(q));
  }
  return arr.slice().sort((a,b)=> state.sortNewestFirst ? b.id - a.id : a.name.localeCompare(b.name));
}
function renderStatStrip(){
  const counts = { pending:0, invited:0, confirmed:0 };
  CUSTOMERS.forEach(c => counts[deriveStatus(getStatus(c))]++);
  const nophone = CUSTOMERS.filter(c => !phoneOf(c)).length;
  const chips = [
    ['pending', 'Belum diundang', counts.pending, '#8A8375'],
    ['invited', 'Sudah diundang', counts.invited, '#B8896A'],
    ['confirmed', 'RSVP confirmed', counts.confirmed, '#2E6B52'],
    ['nophone', 'Tanpa nomor', nophone, '#B23A2E'],
    ['all', 'Semua', CUSTOMERS.length, '#F5F1E6']
  ];
  document.getElementById('statStrip').innerHTML = chips.map(([k,l,n,col]) => `
    <div class="stat-chip ${state.tab===k?'active':''}" data-tab="${k}">
      <span class="dot" style="background:${col}"></span>${l} · ${n}
    </div>`).join('');
}
function renderStaffSelect(){
  const set = Array.from(new Set(CUSTOMERS.map(c => c.staff))).sort();
  const sel = document.getElementById('staffSelect');
  sel.innerHTML = ['<option value="all">Semua tim</option>'].concat(set.map(s => `<option value="${esc(s)}">${esc(s)}</option>`)).join('');
  sel.value = state.staff;
}
function buildMessage(c, key){
  const tmpl = templates[key] || DEFAULT_TEMPLATES[key] || '';
  return tmpl.split('{{nama}}').join(c.name).split('{{nama_depan}}').join(c.name.split(' ')[0]).split('{{link}}').join(IMAGE_URL);
}
const WA_ICON = '<svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2zm5.8 14.14c-.24.68-1.4 1.3-1.93 1.37-.5.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.85-1.23-4.71-4.1-4.85-4.29-.14-.19-1.16-1.54-1.16-2.94 0-1.4.73-2.08 1-2.37.26-.28.57-.35.76-.35h.55c.18 0 .42-.01.65.5.24.55.81 1.93.88 2.07.07.14.11.3.02.49-.09.19-.14.3-.27.46-.14.16-.29.36-.41.48-.14.13-.28.28-.12.55.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.36-.23.6-.14.25.09 1.57.74 1.84.88.28.14.46.21.53.32.07.12.07.68-.17 1.36z"/></svg>';
const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6 9 17l-5-5"/></svg>';

function phoneRowHtml(c){
  const ph = phoneOf(c);
  if(ph && state.editPhone !== c.id){
    return `<div class="phone-row"><span>WhatsApp: ${esc(ph)}</span><button class="link-btn" data-action="editphone" data-id="${c.id}">ubah</button></div>`;
  }
  return `<div class="phone-row">
    ${ph ? '' : '<span class="phone-missing">Nomor WhatsApp belum ada</span>'}
    <input type="tel" inputmode="tel" id="ph-${c.id}" placeholder="08xx atau 628xx" value="${esc(ph)}">
    <button data-action="savephone" data-id="${c.id}">Simpan</button>
  </div>`;
}
function stageRowHtml(c, s, status){
  const done = !!status[s.key];
  const check = `<div class="stage-check ${done?'checked':''}" data-action="toggle" data-id="${c.id}" data-stage="${s.key}">${CHECK_ICON}</div>`;
  if(!s.hasWa){
    return `<div class="stage-row">${check}<div class="stage-info"><div class="stage-title">${s.label}</div>
      <div class="stage-date">${done ? 'Sudah dikonfirmasi' : 'Tandai setelah customer membalas konfirmasi hadir'}</div></div></div>`;
  }
  const ph = phoneOf(c);
  const msg = buildMessage(c, s.key);
  const url = ph ? `https://wa.me/${ph}?text=${encodeURIComponent(msg)}` : '';
  return `<div class="stage-row">${check}
    <div class="stage-info"><div class="stage-title">${s.label}</div>
      <div class="stage-date">${done ? 'Sudah terkirim' : (ph ? 'Belum dikirim' : 'Isi nomor WhatsApp dulu')}</div>
      <button class="preview-toggle" data-action="preview" data-id="${c.id}" data-stage="${s.key}">lihat pesan</button>
      <div class="preview-box" id="prev-${c.id}-${s.key}">${esc(msg)}</div></div>
    <button class="wa-btn" data-action="wa" data-url="${esc(url)}" ${ph?'':'disabled'} aria-label="Kirim WhatsApp">${WA_ICON}</button>
  </div>`;
}
function customerCardHtml(c){
  const status = getStatus(c);
  const meta = STATUS_META[deriveStatus(status)];
  const dots = STAGES.map(s => `<span class="d ${status[s.key]?'done':''}" title="${s.label}"></span>`).join('');
  const open = state.openCard === c.id;
  const noPhone = !phoneOf(c);
  return `
  <div class="card ${open?'open':''}" style="border-left-color:${noPhone?'#B23A2E':'#8C5A6A'}" data-cardid="${c.id}">
    <div class="card-head" data-action="expand" data-id="${c.id}">
      <div class="name-block">
        <div class="card-name">${esc(c.name)}</div>
        <div class="card-meta"><span>${esc(c.staff)}</span>${noPhone ? '<span class="phone-missing">· tanpa nomor</span>' : ''}</div>
      </div>
      <div class="stage-dots">${dots}</div>
      <div class="days-badge" style="color:${meta.color}; background:${meta.bg}">${meta.label}</div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
    <div class="card-body">
      ${c.items ? `<div class="item-note">Pernah membeli: ${esc(c.items)}</div>` : ''}
      ${phoneRowHtml(c)}
      ${STAGES.map(s => stageRowHtml(c, s, status)).join('')}
    </div>
  </div>`;
}
function render(){
  renderStatStrip();
  document.getElementById('urgentCount').textContent = pendingCount();
  const all = filteredCustomers();
  document.getElementById('resultCount').textContent = `${all.length} pelanggan`;
  const listEl = document.getElementById('list');
  const slice = all.slice(0, state.visible);
  if(!slice.length){
    listEl.innerHTML = `<div class="empty-state"><p>Tidak ada pelanggan yang cocok.</p><p>Coba ubah filter atau kata kunci pencarian.</p></div>`;
    return;
  }
  let html = slice.map(customerCardHtml).join('');
  if(all.length > state.visible) html += `<button class="load-more" data-action="more">Muat lebih banyak (${all.length - state.visible} lagi)</button>`;
  listEl.innerHTML = html;
}

/* ============ Settings (message templates) ============ */
const TEMPLATE_TABS = [
  { key:'invite', label:'Undangan' },
  { key:'rsvpchase', label:'Follow-up RSVP' },
  { key:'reminder', label:'Reminder H-1' }
];
function renderTierTabs(){
  document.getElementById('tierTabs').innerHTML = TEMPLATE_TABS.map(t => `
    <div class="tier-tab ${state.settingsStage===t.key?'active':''}"
      style="${state.settingsStage===t.key?'background:#3F1523;border-color:#3F1523':''}" data-stage="${t.key}">${t.label}</div>`).join('');
}
function renderTmplFields(){
  const s = state.settingsStage;
  document.getElementById('tmplFields').innerHTML = `
    <div class="tmpl-field"><label>Isi pesan</label>
      <textarea data-stage="${s}" style="min-height:240px">${esc(templates[s] || '')}</textarea>
      <p class="tmpl-hint">Gunakan {{nama}} untuk nama lengkap, {{nama_depan}} untuk nama depan${s==='invite' ? ', dan {{link}} untuk link gambar undangan' : ''}. Tanda *tebal* dan _miring_ akan tampil di WhatsApp.</p></div>`;
}
function openSettings(){ renderTierTabs(); renderTmplFields();
  document.getElementById('modalBackdrop').classList.add('show'); document.getElementById('settingsModal').classList.add('show'); }
function closeSettings(){
  document.getElementById('modalBackdrop').classList.remove('show'); document.getElementById('settingsModal').classList.remove('show'); }
function showToast(msg){
  const el = document.getElementById('saveToast'); el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1800);
}

/* ============ Events ============ */
function wireEvents(){
  document.getElementById('statStrip').addEventListener('click', e=>{
    const chip = e.target.closest('.stat-chip'); if(!chip) return;
    state.tab = chip.dataset.tab; state.visible = PAGE_SIZE; render();
  });
  document.getElementById('searchInput').addEventListener('input', e=>{
    state.search = e.target.value; state.visible = PAGE_SIZE; render();
  });
  document.getElementById('staffSelect').addEventListener('change', e=>{
    state.staff = e.target.value; state.visible = PAGE_SIZE;
    try{ localStorage.setItem('lol-my-staff', state.staff); }catch(err){}
    render();
  });
  const sortBtn = document.getElementById('sortToggle');
  sortBtn.textContent = 'A-Z';
  sortBtn.addEventListener('click', ()=>{
    state.sortNewestFirst = !state.sortNewestFirst;
    sortBtn.textContent = state.sortNewestFirst ? 'Terbaru dulu' : 'A-Z';
    render();
  });

  document.getElementById('list').addEventListener('click', async e=>{
    if(e.target.closest('[data-action="more"]')){ state.visible += PAGE_SIZE; render(); return; }

    const savePh = e.target.closest('[data-action="savephone"]');
    if(savePh){
      const id = Number(savePh.dataset.id);
      const input = document.getElementById('ph-' + id);
      const n = normPhone(input ? input.value : '');
      if(!n){ showToast('Nomor tidak valid'); return; }
      phones[id] = n; state.editPhone = null; render();
      await saveEntry('lol-phones', phones, id);
      showToast('Nomor tersimpan');
      return;
    }
    const editPh = e.target.closest('[data-action="editphone"]');
    if(editPh){ state.editPhone = Number(editPh.dataset.id); render(); return; }

    if(e.target.closest('input')) return;

    const expand = e.target.closest('[data-action="expand"]');
    if(expand){
      const id = Number(expand.dataset.id);
      state.openCard = state.openCard === id ? null : id; state.editPhone = null; render(); return;
    }
    const toggle = e.target.closest('[data-action="toggle"]');
    if(toggle){
      const id = Number(toggle.dataset.id), stage = toggle.dataset.stage;
      if(!statusData[id]) statusData[id] = { invite:false, rsvpchase:false, confirmed:false, reminder:false };
      statusData[id][stage] = !statusData[id][stage];
      render();
      await saveEntry('lol-status', statusData, id);
      return;
    }
    const preview = e.target.closest('[data-action="preview"]');
    if(preview){
      const box = document.getElementById(`prev-${preview.dataset.id}-${preview.dataset.stage}`);
      if(box) box.classList.toggle('show'); return;
    }
    const wa = e.target.closest('[data-action="wa"]');
    if(wa && wa.dataset.url){ window.open(wa.dataset.url, '_blank'); }
  });

  document.getElementById('openSettings').addEventListener('click', openSettings);
  document.getElementById('closeSettings').addEventListener('click', closeSettings);
  document.getElementById('modalBackdrop').addEventListener('click', closeSettings);
  document.getElementById('tierTabs').addEventListener('click', e=>{
    const tab = e.target.closest('.tier-tab'); if(!tab) return;
    state.settingsStage = tab.dataset.stage; renderTierTabs(); renderTmplFields();
  });
  document.getElementById('tmplFields').addEventListener('input', e=>{
    const ta = e.target.closest('textarea[data-stage]'); if(ta) templates[ta.dataset.stage] = ta.value;
  });
  document.getElementById('saveTemplates').addEventListener('click', async ()=>{
    const ok = await saveTemplatesToStorage();
    showToast(ok ? 'Template tersimpan' : 'Gagal menyimpan, coba lagi');
    if(ok) render();
  });
  document.getElementById('resetTemplates').addEventListener('click', ()=>{
    templates[state.settingsStage] = DEFAULT_TEMPLATES[state.settingsStage]; renderTmplFields();
  });
}

/* ============ Init ============ */
let started = false;
async function start(){
  buildCustomers();
  await loadAll();
  renderStaffSelect();
  if(!started){ wireEvents(); wireResumeRefresh(); started = true; }
  renderSyncBanner();
  render();
  document.getElementById('loadingScreen').style.display = 'none';
}
boot();

</script>

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(()=>{}); });
  }
</script>
